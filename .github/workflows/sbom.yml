name: Trigger Remote SBOM Workflow

on:
  release:
    types: [published]
  schedule:
    - cron: '0 0 1 * *'
  workflow_dispatch:

# contents: write is required so the reusable dev-ops workflow can upload the generated SBOM to the GitHub release
permissions:
  contents: write
  actions: write

jobs:
  call-remote-workflow:
    uses: eclipse-xfsc/dev-ops/.github/workflows/sbom-maven.yml@main
    secrets:
      GH_TOKEN: ${{ github.token }}

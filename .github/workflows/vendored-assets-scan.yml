name: Vendored Assets Inventory

on:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  publish-inventory:
    name: Publish vendored-asset inventory
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          lfs: true

      # Informational only, run at release time - no fail-on-drift gate.
      # This lists which committed jars / vendored front-end files sit
      # outside the Maven dependency tree; it does not identify licences.
      # See fc-tools/scan-vendored-assets.sh --check for the (unused in CI)
      # baseline-diff mode kept for local ad-hoc use.
      - name: Generate vendored-asset file list
        run: ./fc-tools/scan-vendored-assets.sh > vendored-assets-inventory.txt

      # fc-tools/oss-inventory-vendored-assets.csv is the actual dependency
      # + version + licence inventory (hand-maintained, not generated) - the
      # file list above only tells you *that* something changed, not what
      # it is or under what licence. Publish both.
      - name: Upload inventory as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: vendored-assets-inventory
          path: |
            vendored-assets-inventory.txt
            fc-tools/oss-inventory-vendored-assets.csv

      - name: Attach inventory to the release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ github.event.release.tag_name }}" \
            vendored-assets-inventory.txt \
            fc-tools/oss-inventory-vendored-assets.csv \
            --clobber

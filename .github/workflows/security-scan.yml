name: Security Scan (OSV + Grype)

on:
  release:
    types: [published]
  schedule:
    - cron: '0 0 1 * *'
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  security-events: write

jobs:
  osv-scan:
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@6e4298ebc4db23e847df9b2e2de2939d6f066c67 # v2.5.1
    with:
      # gating is done by the severity-gate job below; osv-scanner has no built-in severity threshold
      fail-on-vuln: false

  severity-gate:
    name: Fail on CVSS > 7.0
    needs: [osv-scan, grype-scan]
    runs-on: ubuntu-latest
    permissions:
      actions: read
    steps:
      - name: Download OSV-Scanner SARIF
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: OSV Scanner SARIF file

      - name: Download Grype SARIF
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: grype-report

      - name: Fail if any finding exceeds severity threshold
        env:
          SEVERITY_THRESHOLD: "7.0"
          GRYPE_SARIF: grype-report-${{ github.sha }}.sarif
        run: |
          python3 - <<'PY'
          import json
          import os
          import sys

          threshold = float(os.environ["SEVERITY_THRESHOLD"])

          reports = [
              ("OSV", "results.sarif"),
              ("Grype", os.environ["GRYPE_SARIF"]),
          ]

          failures = []
          for report_name, path in reports:
              if not os.path.exists(path):
                  continue
              with open(path) as f:
                  data = json.load(f)

              for run in data.get("runs", []):
                  rules = {r["id"]: r for r in run.get("tool", {}).get("driver", {}).get("rules", [])}
                  for result in run.get("results", []):
                      rule = rules.get(result.get("ruleId"), {})
                      severity = rule.get("properties", {}).get("security-severity")
                      try:
                          score = float(severity)
                      except (TypeError, ValueError):
                          continue
                      if score > threshold:
                          location = result.get("locations", [{}])[0].get("physicalLocation", {}) \
                              .get("artifactLocation", {}).get("uri", "unknown")
                          failures.append((score, report_name, result.get("ruleId"), location))

          if failures:
              failures.sort(key=lambda entry: -entry[0])
              print(f"::error::{len(failures)} finding(s) exceed severity {threshold}:")
              for score, report_name, rule_id, location in failures:
                  print(f"  {score}  [{report_name}]  {rule_id}  {location}")
              sys.exit(1)

          print(f"No findings above severity {threshold}.")
          PY

  # On a published release, attach the OSV report next to the other release
  # assets (SBOM, DEPENDENCIES). Deliberately not gated on severity-gate, so the
  # report is published even when the release documents a known, accepted
  # finding above the threshold.
  publish-osv-report:
    name: Publish OSV report as release asset
    needs: osv-scan
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - name: Download OSV-Scanner SARIF
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: OSV Scanner SARIF file

      - name: Name report with commit hash
        run: cp results.sarif "osv-report-${{ github.sha }}.sarif"

      - name: Attach OSV report to release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: osv-report-${{ github.sha }}.sarif

  # Grype is a second, complementary scanner over the same CycloneDX SBOM used
  # by the OSV scan above. The scan step itself never fails the build, so the
  # report always publishes; severity-gate applies the same CVSS > 7.0
  # threshold to both scanners' findings.
  grype-scan:
    name: Grype second-opinion scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Java
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Generate CycloneDX SBOM for this scan
        run: |
          mvn org.cyclonedx:cyclonedx-maven-plugin:2.7.9:makeAggregateBom \
            -Dcyclonedx.outputFormat=json

      - name: Scan SBOM with Grype
        id: grype
        uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
        with:
          sbom: target/bom.json
          # Defers gating to the shared severity-gate job instead of failing here.
          fail-build: false
          output-format: sarif

      - name: Name report with commit hash
        run: cp "${{ steps.grype.outputs.sarif }}" "grype-report-${{ github.sha }}.sarif"

      - name: Upload Grype report as workflow artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: grype-report
          path: grype-report-${{ github.sha }}.sarif
          retention-days: 90

  # Split from grype-scan so the build/scan job above stays contents: read;
  # only this upload-only job (mirroring publish-osv-report) needs write.
  publish-grype-report:
    name: Publish Grype report as release asset
    needs: grype-scan
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - name: Download Grype report
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: grype-report

      - name: Attach Grype report to release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: grype-report-${{ github.sha }}.sarif

apiVersion: v1
kind: Pod
metadata:
  name: "{{ include "fc-service.fullname" . }}-test-connection"
  labels:
    {{- include "fc-service.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test
spec:
  containers:
    - name: wget
      image: busybox
      command: ['wget']
      args: ['{{ include "fc-service.fullname" . }}:{{ .Values.service.port }}']
  restartPolicy: Never
